<?xml version="1.0" encoding="UTF-8"?>
<!-- BlackRock: full wordmark is ~7:1 wide; at 32px it collapses to a few pixels tall. BR monogram fills the square and reads in the matrix. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
  <text x="16" y="16" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="800" font-size="14" letter-spacing="-0.04em" fill="#FFFFFF">BR</text>
</svg>
