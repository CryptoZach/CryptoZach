<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Rain-grade Render Network mark. The official art is a hairline C-arc,
       a small center dot, and a tiny corner doughnut on a 2500 viewBox; at
       16px that collapsed to a faint C. Thicken every part and fill the
       canvas so the C, the core, and the opening ring all survive BOX. -->
  <circle cx="66" cy="68" r="24" fill="#FFFFFF"/>
  <circle cx="66" cy="68" r="42" fill="none" stroke="#FFFFFF" stroke-width="16"
          pathLength="100" stroke-dasharray="76 24" stroke-dashoffset="6"
          transform="rotate(-138 66 68)"/>
  <circle cx="34" cy="34" r="16" fill="none" stroke="#FFFFFF" stroke-width="10"/>
</svg>
