<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <title>Render inverse rain mark</title>
  <defs>
    <mask id="render-cutout" x="0" y="0" width="128" height="128" maskUnits="userSpaceOnUse" mask-type="luminance">
      <rect width="128" height="128" fill="#FFFFFF"/>
      <circle cx="66" cy="68" r="24" fill="#000000"/>
      <circle cx="66" cy="68" r="42" fill="none" stroke="#000000" stroke-width="16"
              pathLength="100" stroke-dasharray="76 24" stroke-dashoffset="6"
              transform="rotate(-138 66 68)"/>
      <circle cx="34" cy="34" r="16" fill="none" stroke="#000000" stroke-width="10"/>
    </mask>
  </defs>
  <circle cx="64" cy="64" r="64" fill="#FFFFFF" mask="url(#render-cutout)"/>
</svg>
