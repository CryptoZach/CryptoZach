# Jekyll config for tokenization.systems (GitHub Pages auto-build).
#
# This site is a static HTML site. No served page uses Liquid templating.
# Jekyll runs only because GitHub Pages forces it; its sole purpose here is
# to pass HTML/asset files through.
#
# The exclude list scopes Jekyll to skip repo metadata, build tooling, and
# editor config that live alongside the site source but are not pages.

title: Tokenization Systems
# Explicit description keeps the build hermetic: without it, jekyll-seo-tag
# falls back to jekyll-github-metadata's repo tagline, which requires a live
# api.github.com call at build time (2026-07-16 incident: a GitHub API 503
# failed the whole build inside that fallback). Copy mirrors the homepage
# meta description.
description: >-
  Digital money should be programmable money. Research on stablecoins,
  tokenization, and tokenomics, with eight SSRN papers and fourteen federal
  comment letters.
url: https://tokenization.systems

# Required by jekyll-github-metadata (bundled in github-pages gem). In CI
# contexts where no `origin` git remote is configured (GitHub Actions
# checkout omits remotes by default), the plugin cannot derive the repo
# name from the git remote and will fail the build with "No repo name
# found" unless explicitly configured here OR PAGES_REPO_NWO env var is
# set at the workflow step level. This config is the self-documenting
# home.
repository: CryptoZach/CryptoZach

# Keep Jekyll's defaults working for the few stub Markdown notes that do
# live under served paths (e.g. papers/pub3_ssrn_link.md).
markdown: kramdown
kramdown:
  input: GFM

# Re-include Jekyll defaults plus our operational dirs/files. Jekyll
# REPLACES (does not merge) defaults when `exclude:` is set, so we list
# everything we want skipped.
exclude:
  # Jekyll defaults
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

  # Test artifacts and tooling outputs (not site content)
  - playwright-report/
  - playwright/
  - .playwright-mcp/
  - test-results/

  # Repo metadata and config (not site content)
  - README.md
  - CLAUDE.md
  - CLOUDFLARE_ACTIONS.md
  - OFFSITE_ACTIONS.md
  - LICENSE
  - LICENSE-CONTENT.md
  - AI_Governance_Profile_Content.md
  - package.json
  - package-lock.json
  - purgecss.config.cjs
  - __pycache__/

  # Build tooling (no Markdown to render, but scoped out for clarity)
  - scripts/

  # Chrome partials (source of truth for the stamped header/nav/footer;
  # underscore paths are unserved by Jekyll anyway, listed for clarity)
  - _partials/
