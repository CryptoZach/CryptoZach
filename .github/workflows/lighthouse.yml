name: Lighthouse budgets (live site)

# Audits the live site after every successful deploy and once a week, against the
# budgets in lighthouserc.json. Warn-only on purpose: a regression shows up in the run
# summary and the uploaded reports, and never blocks a deploy that already happened.
# Tighten an assertion from "warn" to "error" once the live score sits above it for a
# few weeks; a scheduled run then fails loudly when the site drifts under the budget.

on:
  workflow_run:
    workflows: ["Build and Deploy to GitHub Pages"]
    types: [completed]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.repository == 'CryptoZach/CryptoZach' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (for lighthouserc.json)
        uses: actions/checkout@v7

      - name: Let the Pages deploy propagate
        if: github.event_name == 'workflow_run'
        run: sleep 120

      - name: Audit the live pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://tokenization.systems/
            https://tokenization.systems/research/
            https://tokenization.systems/letters/
            https://tokenization.systems/frameworks/
            https://tokenization.systems/trackers/genius-act/
          configPath: ./lighthouserc.json
          runs: 2
          uploadArtifacts: true
          temporaryPublicStorage: false
