name: Build and Deploy to GitHub Pages

# Active deploy path for tokenization.systems. Every push to main (and manual
# workflow_dispatch) builds the Jekyll site, post-processes CSS, gates on broken
# image references, and deploys to GitHub Pages. The Pages source is set to
# "GitHub Actions" (repo Settings > Pages; build_type "workflow"). The deploy
# step is retry-wrapped (see the deploy job): the Pages backend intermittently
# returns a transient "Deployment failed, try again later," so a single attempt
# is not reliable.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deploy; skip intermediate runs that pile up
# during rapid pushes (standard GitHub Pages pattern).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skip on mirror repos (e.g., private archive at CryptoZach/Claude1) where
    # GitHub Pages is not enabled. Without this guard, the deploy job 404s on
    # any repo without Pages, producing failed-workflow noise on every push.
    if: github.repository == 'CryptoZach/CryptoZach'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Site consistency gate (letter count + hero stats + chrome)
        # Build-time enforcement of the single-source-of-truth surfaces: block the
        # deploy if the federal-comment-letter count, the homepage hero-stat
        # block, or a page's stamped header/footer chrome drifts from its source.
        # check_letter_count.py derives the count from published letter pages;
        # render_home_stats.py --check verifies the marker-delimited hero block
        # matches scripts/program_stats.json; render_chrome.py --check verifies
        # every nav-bearing page's chrome regions match _partials/. Mirrors
        # the site-clone pre-push guard, one step earlier and on every deploy path
        # (incl. direct GitHub edits that skip the pre-push hook). FAIL-CLOSED on a
        # real mismatch (exit 1), FAIL-OPEN on an internal error (exit 2).
        shell: bash
        run: |
          run_check() {
            # `if` guards the call from set -e so a non-zero exit is captured, not
            # fatal: exit 1 blocks (real drift), exit >=2 fail-opens (guard error).
            if python3 "$@"; then rc=0; else rc=$?; fi
            if [ "$rc" -eq 1 ]; then echo "::error::site consistency drift: $*"; exit 1; fi
            if [ "$rc" -ge 2 ]; then echo "::warning::$* could not run (exit $rc); not blocking"; fi
          }
          run_check scripts/check_letter_count.py --quiet
          run_check scripts/render_home_stats.py --check
          run_check scripts/render_chrome.py --check

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: CSS duplicate-selector lint (stylelint; warn-only)
        # no-duplicate-selectors surfaces accidentally repeated selectors in the
        # source CSS. WARN-ONLY (continue-on-error): the hand-maintained CSS uses
        # many deliberate later-rule cascade overrides, so this rule reports a
        # large mixed set (intentional overrides + genuine dups). It is an
        # informational signal pending a dedup-triage cycle, not a deploy blocker.
        # Flip to a hard gate only after the legitimate-override findings are
        # triaged out (e.g. via per-line stylelint-disable or rule narrowing).
        continue-on-error: true
        run: npm run lint:css

      - name: Build Jekyll site
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
          # Pass the auto-provisioned GITHUB_TOKEN so jekyll-github-metadata
          # can authenticate GitHub API calls (otherwise it logs "No GitHub
          # API authentication could be found" warnings). Combined with the
          # `repository:` config in _config.yml, this satisfies the plugin's
          # requirements in CI.
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post-process (PurgeCSS + minify + critical CSS)
        run: npm run build:postprocess:with-purgecss

      - name: Cache-buster deploy gate (built _site/)
        # Verifies that the content-hash cache-buster actually FIRED. If
        # scripts/inline-critical-css.mjs silently no-ops, every built page ships the
        # SOURCE INTEGER instead: the site renders, the deploy succeeds, and returning
        # visitors keep a stale stylesheet until that integer happens to change. Nothing
        # else in this pipeline would notice. Fails the build on an integer, on an
        # unclassifiable value, on two different hashes for one asset, and on a zero scan
        # (which means the check stopped running rather than the site being clean).
        # Self-test: python3 scripts/check_built_cache_busters.py --selftest
        run: python3 scripts/check_built_cache_busters.py _site

      - name: Broken-image-ref deploy gate (built _site/)
        # Self-contained 404 guard: blocks the upload+deploy if any built page
        # references an image file missing from _site/. Mirrors
        # scripts/orphan_figure_guard.py --broken-only, which cannot run in the
        # site-only deploy repo (it carries no scripts/). python3 is preinstalled.
        run: |
          python3 - <<'PY'
          # Inline broken-image-ref deploy gate (self-contained; stdlib only).
          # Scans the BUILT _site/ for img src / og:image content / icon href / srcset /
          # CSS url() / JSON-LD image refs that point at a file missing from _site/.
          # Root-relative refs resolve from _site/ (the site is served from the site root;
          # _config.yml has no baseurl). Same-site absolute URLs (canonical hosts) are
          # resolved locally; foreign hosts, data:, protocol-relative, and template tokens
          # are skipped. Exit non-zero on any broken ref so the upload+deploy is blocked.
          # Mirrors scripts/orphan_figure_guard.py --broken-only (which cannot run in the
          # site-only CI repo, which carries no scripts/).
          import os
          import re
          import sys
          from pathlib import Path

          SITE = Path(os.environ.get("CI_SITE_DIR", "_site")).resolve()
          IMG_EXT = ("png", "jpg", "jpeg", "webp", "svg", "gif", "ico")
          EXT_ALT = "|".join(IMG_EXT)
          CANON_HOSTS = (
              "tokenization.systems", "www.tokenization.systems",
              "cryptozach.com", "www.cryptozach.com",
          )

          ATTR_RE = re.compile(
              r'''(?:src|content|href|data-src)\s*=\s*["']([^"']+\.(?:%s)(?:\?[^"']*)?(?:\#[^"']*)?)["']''' % EXT_ALT,
              re.I)
          SRCSET_RE = re.compile(r'''srcset\s*=\s*["']([^"']+)["']''', re.I)
          URL_RE = re.compile(
              r'''url\(\s*["']?([^"')]+\.(?:%s)(?:\?[^"')]*)?)["']?\s*\)''' % EXT_ALT, re.I)
          JSONLD_RE = re.compile(
              r'''"(?:image|logo|thumbnailUrl|contentUrl)"\s*:\s*"([^"]+\.(?:%s)(?:\?[^"]*)?)"''' % EXT_ALT, re.I)


          def is_external(ref):
              r = ref.strip()
              return (r.startswith("http://") or r.startswith("https://") or r.startswith("//")
                      or r.startswith("data:") or r.startswith("mailto:") or "{{" in r or "{%" in r
                      or r.startswith("$") or r == "")


          def strip_suffix(ref):
              return ref.split("?", 1)[0].split("#", 1)[0].strip()


          def canonicalize_local(ref):
              m = re.match(r'https?://([^/]+)(/[^\s]*)?$', ref.strip(), re.I)
              if m and m.group(1).lower() in CANON_HOSTS:
                  return m.group(2) or "/"
              return ref


          def extract_refs(text):
              refs = set()
              for rx in (ATTR_RE, URL_RE, JSONLD_RE):
                  refs.update(m.group(1) for m in rx.finditer(text))
              for m in SRCSET_RE.finditer(text):
                  for cand in m.group(1).split(","):
                      url = cand.strip().split()[0] if cand.strip() else ""
                      if re.search(r"\.(?:%s)(?:[?#]|$)" % EXT_ALT, url, re.I):
                          refs.add(url)
              return refs


          def resolve(ref, html_path):
              ref = canonicalize_local(strip_suffix(ref))
              if is_external(ref) or not ref:
                  return None
              if ref.startswith("/"):
                  return (SITE / ref.lstrip("/")).resolve()
              return (html_path.parent / ref).resolve()


          def rel(p):
              try:
                  return str(p.relative_to(SITE))
              except ValueError:
                  return str(p)


          def main():
              if not SITE.is_dir():
                  print("::error::broken-ref gate: built site dir %s not found" % SITE)
                  return 1
              broken = []
              for dirpath, _dirnames, filenames in os.walk(SITE):
                  for fn in filenames:
                      if not fn.lower().endswith(".html"):
                          continue
                      html = Path(dirpath) / fn
                      try:
                          text = html.read_text(encoding="utf-8", errors="replace")
                      except Exception:
                          continue
                      for ref in extract_refs(text):
                          target = resolve(ref, html)
                          if target is None:
                              continue
                          if not target.exists():
                              broken.append((rel(html), ref, rel(target)))
              broken = sorted(set(broken))
              if broken:
                  print("::error::broken image ref(s) in built _site/ (%d) -- deploy blocked:" % len(broken))
                  for page, ref, target in broken:
                      print("  %s: %s  ->  MISSING %s" % (page, ref, target))
                  return 1
              print("[ci-broken-ref-gate] clean: no broken image refs in built _site/")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.repository == 'CryptoZach/CryptoZach'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Whichever attempt actually deploys sets page_url; the || chain selects it.
      # A failed or skipped attempt exposes an empty output and falls through.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url || steps.deployment-final.outputs.page_url }}
    steps:
      # actions/deploy-pages intermittently returns "Deployment failed, try again
      # later" from the Pages backend. That is a transient infrastructure error,
      # not a content problem: the build job has already succeeded and uploaded the
      # artifact every time. Left un-retried, one such failure silently strands the
      # pushed change until the next successful deploy (observed 2026-07-02:
      # f40736f47 built clean but its deploy step failed and the change sat
      # un-shipped for about five hours). Retry the deploy across three attempts
      # with a short backoff. The first two attempts are continue-on-error; the
      # third is not, so an exhausted retry chain still fails the job and a genuine
      # persistent failure surfaces rather than passing silently.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Backoff before attempt 2
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Backoff before attempt 3
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (attempt 3, final)
        id: deployment-final
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
