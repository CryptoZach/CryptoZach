  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #1a1a1a; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <script>
    var params = new URLSearchParams(window.location.search);
    var file = params.get('file');
    if (file && file.match(/^\/resumes\/.*\.pdf$/)) {
      var fullUrl = 'https://tokenization.systems' + file;
      var iframe = document.createElement('iframe');
      iframe.src = 'https://docs.google.com/gview?embedded=true&url=' + encodeURIComponent(fullUrl);
      iframe.setAttribute('allowfullscreen', '');
      document.body.appendChild(iframe);
    } else {
      document.body.style.color = '#ccc';
      document.body.style.padding = '2rem';
      document.body.textContent = 'PDF not found.';
    }
  </script>
</body>
